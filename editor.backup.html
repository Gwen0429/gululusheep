<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gululu Sheep — Editor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: #222;
            font-family: Georgia, "Times New Roman", serif;
        }

        .editor {
            width: min(900px, calc(100% - 40px));
            margin: 60px auto 100px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 50px;
            font-size: 14px;
        }

        .top a {
            color: #222;
            text-decoration: none;
        }

        .top a:hover {
            text-decoration: underline;
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            font-family: Georgia, "Times New Roman", serif;
            color: #222;
            background: transparent;
        }

        .title {
            font-size: clamp(30px, 5vw, 48px);
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .english-title {
            font-size: 22px;
            margin-bottom: 35px;
        }

        .date {
            font-size: 14px;
            color: #777;
            margin-bottom: 45px;
        }

        .language {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .language button {
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
        }

        .language button.active {
            text-decoration: underline;
        }

        .content {
            min-height: 500px;
            outline: none;
            font-size: 18px;
            line-height: 1.9;
        }

        .content:empty::before {
            content: "在这里写文章……";
            color: #aaa;
        }

        .content img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 35px 0;
            cursor: pointer;
        }

        .image-wrapper {
            position: relative;
            display: block;
            margin: 35px 0;
        }

        .image-wrapper img {
            margin: 0;
        }

        .image-controls {
            margin-top: 8px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 12px;
            color: #777;
        }

        .image-controls button {
            border: none;
            background: none;
            cursor: pointer;
            padding: 0 10px 0 0;
            color: #777;
        }

        .image-controls button:hover {
            text-decoration: underline;
        }

        .toolbar {
            position: sticky;
            bottom: 20px;
            margin-top: 40px;
            padding: 12px 15px;
            background: white;
            border: 1px solid #ddd;
            display: flex;
            gap: 20px;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 13px;
        }

        .toolbar button {
            border: none;
            background: none;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }

        .toolbar button:hover {
            text-decoration: underline;
        }

        .status {
            margin-left: auto;
            color: #888;
        }

        @media (max-width: 600px) {
            .editor {
                width: calc(100% - 28px);
                margin-top: 30px;
            }

            .top {
                margin-bottom: 35px;
            }

            .content {
                font-size: 17px;
                line-height: 1.8;
            }

            .toolbar {
                bottom: 10px;
            }
        }
    </style>
</head>

<body>

<div class="editor">

    <div class="top">
        <a href="index.html">← Gululu Sheep</a>
        <span>Editor</span>
    </div>

    <input
        id="titleZh"
        class="title"
        type="text"
        placeholder="中文标题"
    >

    <input
        id="titleEn"
        class="english-title"
        type="text"
        placeholder="English title"
    >

    <input
        id="date"
        class="date"
        type="date"
    >

    <div class="language">
        <button id="zhButton" class="active" onclick="switchLanguage('zh')">
            中文
        </button>

        <button id="enButton" onclick="switchLanguage('en')">
            English
        </button>
    </div>

    <div
        id="zhContent"
        class="content"
        contenteditable="true"
    ></div>

    <div
        id="enContent"
        class="content"
        contenteditable="true"
        style="display:none;"
    ></div>

    <div class="toolbar">

        <button onclick="insertImage()">
            添加图片
        </button>

        <button onclick="saveDraft()">
            保存草稿
        </button>

        <span id="status" class="status">
            未保存
        </span>

    </div>

</div>

<input
    id="imageInput"
    type="file"
    accept="image/*"
    multiple
    style="display:none;"
>

<script>

let currentLanguage = "zh";

const zhContent = document.getElementById("zhContent");
const enContent = document.getElementById("enContent");
const zhButton = document.getElementById("zhButton");
const enButton = document.getElementById("enButton");
const imageInput = document.getElementById("imageInput");
const status = document.getElementById("status");

function switchLanguage(language) {

    currentLanguage = language;

    if (language === "zh") {

        zhContent.style.display = "block";
        enContent.style.display = "none";

        zhButton.classList.add("active");
        enButton.classList.remove("active");

    } else {

        zhContent.style.display = "none";
        enContent.style.display = "block";

        enButton.classList.add("active");
        zhButton.classList.remove("active");
    }
}


/* 图片 */

function insertImage() {

    imageInput.value = "";
    imageInput.click();

}


imageInput.addEventListener("change", function () {

    const files = Array.from(this.files);

    files.forEach(file => {

        if (!file.type.startsWith("image/")) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function(event) {

            insertImageAtCursor(event.target.result);

        };

        reader.readAsDataURL(file);

    });

});


function insertImageAtCursor(src) {

    const img = document.createElement("img");

    img.src = src;

    img.style.width = "100%";

    img.style.maxWidth = "720px";

    img.style.height = "auto";

    const selection = window.getSelection();

    if (!selection.rangeCount) {

        getCurrentContent().appendChild(img);

        return;

    }

    const range = selection.getRangeAt(0);

    const container = range.commonAncestorContainer;

    const editor = getCurrentContent();

    if (!editor.contains(container)) {

        editor.appendChild(img);

        return;

    }

    range.deleteContents();

    range.insertNode(img);

    range.setStartAfter(img);

    range.collapse(true);

    selection.removeAllRanges();

    selection.addRange(range);

    addImageControls(img);

}


function getCurrentContent() {

    return currentLanguage === "zh"
        ? zhContent
        : enContent;

}


/* 拖拽图片 */

[zhContent, enContent].forEach(editor => {

    editor.addEventListener("dragover", function(event) {

        event.preventDefault();

    });


    editor.addEventListener("drop", function(event) {

        event.preventDefault();

        const files = Array.from(event.dataTransfer.files);

        files.forEach(file => {

            if (!file.type.startsWith("image/")) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {

                insertImageAtCursor(e.target.result);

            };

            reader.readAsDataURL(file);

        });

    });

});


/* 图片大小 */

function addImageControls(img) {

    if (img.dataset.controlled) {
        return;
    }

    img.dataset.controlled = "true";

    img.addEventListener("click", function() {

        const currentWidth =
            parseInt(img.style.width) || 100;

        const input =
            prompt(
                "图片宽度（例如 50、70、100）%",
                currentWidth
            );

        if (!input) {
            return;
        }

        const width =
            parseInt(input);

        if (
            isNaN(width) ||
            width < 10 ||
            width > 100
        ) {
            return;
        }

        img.style.width = width + "%";

    });

}


/* 初始化已有图片 */

function initializeImages() {

    [zhContent, enContent].forEach(editor => {

        editor.querySelectorAll("img").forEach(img => {

            addImageControls(img);

        });

    });

}


/* 保存草稿 */

function saveDraft() {

    const data = {

        titleZh:
            document.getElementById("titleZh").value,

        titleEn:
            document.getElementById("titleEn").value,

        date:
            document.getElementById("date").value,

        zh:
            zhContent.innerHTML,

        en:
            enContent.innerHTML

    };

    localStorage.setItem(
        "gululusheep-draft",
        JSON.stringify(data)
    );

    status.textContent = "已保存到本机";

}


/* 自动恢复草稿 */

function loadDraft() {

    const saved =
        localStorage.getItem("gululusheep-draft");

    if (!saved) {
        return;
    }

    try {

        const data = JSON.parse(saved);

        document.getElementById("titleZh").value =
            data.titleZh || "";

        document.getElementById("titleEn").value =
            data.titleEn || "";

        document.getElementById("date").value =
            data.date || "";

        zhContent.innerHTML =
            data.zh || "";

        enContent.innerHTML =
            data.en || "";

        initializeImages();

        status.textContent = "已恢复草稿";

    } catch (error) {

        console.log(error);

    }

}


loadDraft();

</script>

</body>
</html>
