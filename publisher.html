<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publish — Gululu Sheep</title>

<style>
body {
    margin: 0;
    background: white;
    color: #111;
    font-family: Georgia, "Times New Roman", serif;
}

main {
    width: min(760px, calc(100% - 40px));
    margin: 80px auto;
}

h1 {
    font-weight: normal;
}

button {
    font: inherit;
    padding: 10px 18px;
    background: white;
    border: 1px solid #111;
    cursor: pointer;
}

#status {
    margin-top: 25px;
    line-height: 1.7;
}
</style>
</head>

<body>

<main>

<h1>Publish</h1>

<button id="publishButton">导出文章</button>

<div id="status"></div>

</main>

<script>

document.getElementById("publishButton").onclick = function () {

    var saved = localStorage.getItem("gululusheep-draft");

    if (!saved) {
        document.getElementById("status").textContent =
            "没有找到文章，请先回 editor.html 保存草稿。";
        return;
    }

    var data = JSON.parse(saved);

    var titleZh = data.titleZh || "";
    var titleEn = data.titleEn || "";
    var date = data.date || "";
    var zh = data.zh || "";
    var en = data.en || "";

    if (!titleZh) {
        alert("请填写中文标题");
        return;
    }

    if (!date) {
        alert("请填写日期");
        return;
    }

    var slug = titleEn
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");

    if (!slug) {
        slug = "article";
    }

    var html = "<!DOCTYPE html>" +
        "<html lang='zh-CN'>" +
        "<head>" +
        "<meta charset='UTF-8'>" +
        "<meta name='viewport' content='width=device-width, initial-scale=1.0'>" +
        "<title>" + titleZh + " — Gululu Sheep</title>" +
        "<link rel='stylesheet' href='../style.css'>" +
        "</head>" +
        "<body>" +
        "<main>" +
        "<article>" +

        "<p><a href='../index.html'>Gululu Sheep</a></p>" +

        "<br>" +

        "<time>" + date + "</time>" +

        "<h1>" + titleZh + "</h1>" +

        "<p>" + titleEn + "</p>" +

        "<div class='language'>" +

        "<button onclick='showZh()'>中文</button>" +

        "<button onclick='showEn()'>English</button>" +

        "</div>" +

        "<div id='zh'>" +
        zh +
        "</div>" +

        "<div id='en' style='display:none;'>" +
        en +
        "</div>" +

        "</article>" +
        "</main>" +

        "<script>" +

        "function showZh() {" +
        "document.getElementById('zh').style.display='';" +
        "document.getElementById('en').style.display='none';" +
        "}" +

        "function showEn() {" +
        "document.getElementById('zh').style.display='none';" +
        "document.getElementById('en').style.display='';" +
        "}" +

        "<\/script>" +

        "</body>" +
        "</html>";

    var blob = new Blob(
        [html],
        {type: "text/html"}
    );

    var url = URL.createObjectURL(blob);

    var link = document.createElement("a");

    link.href = url;
    link.download = slug + ".html";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

    document.getElementById("status").textContent =
        "文章已经生成：" + slug + ".html";
};

</script>

</body>
</html>
